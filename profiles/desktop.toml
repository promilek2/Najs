version = 1
name = "desktop"
description = "Cross-desktop Najs hardware and service baseline"

[packages]
install = [
  "7zip",
  "ark",
  "bash-completion",
  "bluez-obex",
  "bluez-utils",
  "btop",
  "cups",
  "cups-pk-helper",
  "fastfetch",
  "firewalld",
  "firefox",
  "flatpak",
  "fwupd",
  "keepassxc",
  "networkmanager",
  "noto-fonts",
  "pipewire",
  "power-profiles-daemon",
  "system-config-printer",
  "zenity",
]

[services]
enable = [
  "NetworkManager.service",
  "avahi-daemon.service",
  "bluetooth.service",
  "cups.service",
  "firewalld.service",
  "fstrim.timer",
  "power-profiles-daemon.service",
  "vboxservice.service",
]

[configuration]
managed_files = [
  "/etc/najs/manifest.toml",
  "/etc/systemd/journald.conf.d/10-najs-limits.conf",
  "/etc/sysctl.d/90-najs-desktop.conf",
]
