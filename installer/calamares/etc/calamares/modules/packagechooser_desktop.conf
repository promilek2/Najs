---
mode: required
method: packages
labels:
  step: Desktop
default: kde
items:
  - id: kde
    name: KDE Plasma
    description: A polished and highly configurable Wayland desktop. Recommended for most users.
    screenshot: /etc/calamares/images/desktop.svg
    packages: [ plasma-meta, sddm, dolphin, kate, kcalc, konsole, partitionmanager, xdg-desktop-portal-kde ]
  - id: gnome
    name: GNOME
    description: A focused, accessible Wayland desktop with a clean workflow and large controls.
    screenshot: /etc/calamares/images/desktop.svg
    packages: [ gnome, gdm, gnome-disk-utility, xdg-desktop-portal-gnome ]
  - id: hyprland
    name: Hyprland
    description: A modern dynamic tiling Wayland compositor for keyboard-driven workflows.
    screenshot: /etc/calamares/images/desktop.svg
    packages: [ brightnessctl, grim, hyprland, kitty, mako, network-manager-applet, nwg-displays, nwg-look, polkit-gnome, pavucontrol, sddm, slurp, swaybg, swaylock, thunar, waybar, wl-clipboard, wofi, xdg-desktop-portal-gtk, xdg-desktop-portal-hyprland, xdg-user-dirs ]
  - id: xfce
    name: Xfce
    description: A lightweight and traditional desktop for older or resource-constrained computers.
    screenshot: /etc/calamares/images/desktop.svg
    packages: [ gvfs, xfce4, xfce4-goodies, lightdm, lightdm-gtk-greeter, network-manager-applet, pavucontrol, xdg-desktop-portal-gtk, xdg-desktop-portal-xapp, xorg-server ]
  - id: cinnamon
    name: Cinnamon
    description: A familiar desktop layout with a traditional panel and application menu.
    screenshot: /etc/calamares/images/desktop.svg
    packages: [ cinnamon, gnome-terminal, lightdm, lightdm-gtk-greeter, network-manager-applet, xdg-desktop-portal-gtk, xdg-desktop-portal-xapp, xorg-server ]
