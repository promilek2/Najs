---
mode: required
method: packages
labels:
  step: Graphics
default: auto
items:
  - id: auto
    name: Automatic open-source drivers
    description: Installs Mesa and open Vulkan drivers for AMD, Intel, and newer Nouveau hardware.
    screenshot: /etc/calamares/images/graphics.svg
    packages: [ mesa, vulkan-intel, vulkan-nouveau, vulkan-radeon, lib32-mesa, lib32-vulkan-intel, lib32-vulkan-nouveau, lib32-vulkan-radeon ]
  - id: amd
    name: AMD Radeon
    description: Mesa and RADV Vulkan drivers optimized for AMD graphics hardware.
    screenshot: /etc/calamares/images/graphics.svg
    packages: [ mesa, vulkan-radeon, lib32-mesa, lib32-vulkan-radeon ]
  - id: intel
    name: Intel Graphics
    description: Mesa and ANV Vulkan drivers for integrated and discrete Intel graphics.
    screenshot: /etc/calamares/images/graphics.svg
    packages: [ mesa, vulkan-intel, lib32-mesa, lib32-vulkan-intel ]
  - id: nvidia
    name: NVIDIA Turing or newer
    description: NVIDIA open kernel modules through DKMS with official user-space libraries.
    screenshot: /etc/calamares/images/graphics.svg
    packages: [ nvidia-open-dkms, nvidia-utils, lib32-nvidia-utils, nvidia-settings ]
  - id: vm
    name: Virtual machine
    description: Guest drivers and agents for VirtualBox, QEMU/KVM, and SPICE test systems.
    screenshot: /etc/calamares/images/graphics.svg
    packages: [ mesa, lib32-mesa, qemu-guest-agent, spice-vdagent, virtualbox-guest-utils ]
